<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Facundo Presa — Entrepreneur, Design & Programming" />
    <title>Facundo Presa — Portfolio</title>
    <script>
      // Resolve the colour scheme before first paint. Without this, a reader who
      // prefers dark gets a white flash while React mounts, because the tokens in
      // index.css default to light. useTheme re-applies the same value on mount.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' || stored === 'light'
              ? stored === 'dark'
              : matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (error) {
          /* Private mode can throw on localStorage; light is a fine fallback. */
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
