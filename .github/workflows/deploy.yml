name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-personal-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Deploy
        run: |
          bash /home/hermes/deploy/generic.sh \
            "faku.pro" \
            "git@github.com:faku-org/personal-site.git"